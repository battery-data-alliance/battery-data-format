[mypy]
python_version = 3.10
warn_unused_configs = True
ignore_missing_imports = True
check_untyped_defs = True
disallow_untyped_defs = False
namespace_packages = False
explicit_package_bases = False
mypy_path = src
packages = bdf
plugins =

[mypy-bdf.battinfo.generated.*]
# datamodel-code-generator renders a JSON Schema patternProperties key as
# `constr(pattern=...)`. Pydantic validates that at runtime, but mypy rejects
# a function call in an annotation. The suppression costs the key type alone:
# the map reads as `dict[Any, Model]` instead of `dict[str, Model]`, and every
# other field of the generated package stays checked.
disable_error_code = valid-type

[mypy-bdf.metadata]
# The legacy JSON-LD dataclasses in this module state a tuple default for a
# list-typed parameter. The read handoff models the module also declares stay
# checked, so the suppression names that one error code rather than the module.
disable_error_code = assignment

[mypy-bdf.registry_ld]
ignore_errors = True

[mypy-bdf._explore]
ignore_errors = True

[mypy-bdf.cli]
ignore_errors = True
